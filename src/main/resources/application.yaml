server:
  port: 8089

spring:
  application:
    name: ms-geolocalizacion

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/db_geolocalizacion?createDatabaseIfNotExist=true&serverTimezone=America/Santiago}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# URL de ms-conductores (la usa ConductorClient)
app:
  feign:
    conductores-url: ${MS_CONDUCTORES_URL:http://localhost:8083}

eureka:
  client:
    enabled: false
